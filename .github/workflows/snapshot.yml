name: Täglicher Metrik-Snapshot

on:
  schedule:
    - cron: '17 5 * * *'   # täglich 05:17 UTC (nach US-Handelsschluss, vor EU-Morgen)
  workflow_dispatch: {}     # manueller Start möglich

permissions:
  contents: write

# Zwei parallele Läufe würden sich beim Push gegenseitig überholen.
concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20     # hängende Feeds sollen nicht stundenlang Minuten verbrennen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # tsx kommt aus dem Lockfile statt per `npx -y` in der jeweils neuesten Version —
      # dieser Job darf nach main pushen, da soll nichts Ungepinntes mitlaufen.
      - name: Abhängigkeiten
        run: npm ci

      # Fängt Tippfehler im Builder ab, bevor sie die Daten anfassen.
      - name: Typen prüfen
        run: npm run typecheck

      - name: Snapshot bauen
        run: npm run snapshot

      - name: Committen (nur bei Erfolg)
        run: |
          git config user.name "snapshot-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/snapshot.json data/archive/
          # Bewusst als if — GitHub führt run-Blöcke mit `bash -e` aus, eine fehlschlagende
          # &&-Kette würde den Schritt abbrechen statt sauber weiterzulaufen.
          if git diff --cached --quiet; then
            echo "Keine Änderung — nichts zu committen."
            exit 0
          fi
          git commit -m "Snapshot $(date -u +%F)"
          # Falls in der Zwischenzeit auf main gepusht wurde: aufsetzen statt scheitern.
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              exit 0
            fi
            echo "Push-Versuch $i fehlgeschlagen, neuer Versuch …"
            sleep 5
          done
          echo "Push nach 3 Versuchen fehlgeschlagen."
          exit 1
