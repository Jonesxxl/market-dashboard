name: Täglicher Metrik-Snapshot

on:
  schedule:
    - cron: '17 5 * * *'   # täglich 05:17 UTC (nach US-Handelsschluss, vor EU-Morgen)
  workflow_dispatch: {}     # manueller Start möglich

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Snapshot bauen
        run: npx -y tsx scripts/build-snapshot.ts

      - name: Committen (nur bei Erfolg)
        run: |
          git config user.name "snapshot-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/snapshot.json data/archive/
          git diff --cached --quiet || git commit -m "Snapshot $(date -u +%F)"
          git push
